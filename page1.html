<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }

     body {
  margin: 0;
  width: 960px;
  height: 540px;
  overflow: hidden;

  background-image: url("image.pdf");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
    }

    .container {
      position: absolute; top: 0; left: 0;
      width: 960px; height: 540px;
      display: flex; align-items: center; justify-content: center;
    }

    .phone {
      width: 300px; height: 520px;
      background: #fff;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      position: relative;
      overflow: hidden;
      padding: 58px 24px 44px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .notch {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 20px;
      background: #111;
      border-radius: 20px;
      z-index: 10;
    }

    h1 { font-size: 24px; margin-bottom: 22px; text-align: center; }
    p  { font-size: 14px; text-align: center; opacity: 0.8; margin-top: -6px; margin-bottom: 24px; }

    .chat-preview { width: 100%; margin-bottom: 24px; }

    .bubble {
      background: #f1f1f1;
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }
    .bubble:nth-child(2){ animation-delay: 0.5s; }
    .bubble:nth-child(3){ animation-delay: 1s; }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    button{
      border: none;
      background: linear-gradient(135deg, #ca7eac, #cc288d);
      color: white;
      font-size: 16px;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: block;
      margin: 0 auto;
    }
    button:hover{ transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
  </style>
</head>

<body>
  <div class="container">
    <div class="phone">
      <div class="notch"></div>

      <h1>WHO IS BEHIND THE SCREEN 💬</h1>
      <p>Can you trust anybody behind the screen? Could there be AI scams hiding in your DMs?</p>

      <div class="chat-preview">
        <div class="bubble">hey u remember me?</div>
        <div class="bubble">lol long time no see</div>
        <div class="bubble">are u nearby rn?</div>
      </div>

      <button id="btnStart">START</button>
    </div>
  </div>

  <script>
  document.getElementById("btnStart").addEventListener("click", () => {
  localStorage.setItem("fromPage1", "true");
  window.location.href = "page2.html";
});
</script>
</body>
</html>
