<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro</title>
  <style>
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      margin: 0;
      width: 960px;
      height: 540px;
      overflow: hidden;
      background-image: url("image.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .container {
      position: absolute;
      top: 0; left: 0;
      width: 960px; height: 540px;
      display: flex; align-items: center; justify-content: center;
    }

    .phone {
      width: 300px; height: 520px;
      background: #fff; border-radius: 40px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative; overflow: hidden;
    }

    .notch {
      position: absolute; top: 10px;
      width: 120px; height: 20px; background: #111; border-radius: 20px;
      left: 50%; transform: translateX(-50%); z-index: 10;
    }

    .phone{ padding: 0; }

    .screen{
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      padding: 58px 24px 44px;
      display: none;
    }
    .screen.active{
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    #screen-scout{
      padding-top: 40px; padding-right: 24px; padding-bottom: 36px; padding-left: 24px;
      gap: 8px;
    }

    #screen-scout h1{
      font-size: 18px; line-height: 1.15; margin: 0 0 6px; text-align: center;
    }

    .scout-card{
      width: 100%; background: #fff; border: 1px solid #eee; border-radius: 18px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.04);
      display: flex; padding: 18px;
    }

    .scout-wrap{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0; min-height: 0; }
    .scout-img{ width: 210px; height: 220px; object-fit: contain; display: block; margin-top: 2px; flex: 0 0 auto; }

    @keyframes popIn {
      0% { transform: translateY(10px) scale(0.98); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .scout-bubble{
      width: 100%; background: #f6f6f6; border-radius: 18px; padding: 14px;
      font-size: 13px; line-height: 1.5; position: relative; animation: popIn 220ms ease-out;
    }

    .scout-bubble::before{
      content:""; position:absolute; top:-8px; left: 46%;
      width: 16px; height: 16px; background:#f6f6f6; transform: rotate(45deg); border-radius: 4px;
    }

    .scout-name{ color: #cc288d; font-weight: 800; }

    .typing{
      width: 100%; background: #f6f6f6; border-radius: 18px; padding: 12px 14px;
      font-size: 12px; opacity: 0.7; display: flex; gap: 6px; align-items: center;
    }

    .dots{ display: inline-flex; gap: 4px; }
    .dots span{
      width: 6px; height: 6px; border-radius: 99px; background: #bbb; display: inline-block;
      animation: bounce 0.9s infinite ease-in-out;
    }
    .dots span:nth-child(2){ animation-delay: 0.15s; }
    .dots span:nth-child(3){ animation-delay: 0.3s; }

    @keyframes bounce{
      0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
      40% { transform: translateY(-3px); opacity: 1; }
    }

    .scout-topbar{
      width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }

    .scout-nav{
      width: 32px; height: 32px; border-radius: 999px; border: 1px solid #eee;
      background: #f7f7f7; color: #cc288d; font-size: 20px; font-weight: 900;
      padding: 0; cursor: pointer; margin: 0 !important; box-shadow: none;
      display: flex; align-items: center; justify-content: center;
    }

    .scout-nav:hover{ transform: scale(1.05); }
    .scout-nav:disabled{ opacity: 0.35; cursor: not-allowed; transform: none; }

    .scout-progress{
      text-align: center; font-size: 14px; opacity: 0.65; font-weight: 700;
    }
    .scout-bubble, .typing{ margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="phone">
      <div class="notch"></div>

      <div class="screen active" id="screen-scout">

        <div class="scout-card">
          <div class="scout-wrap">
            <div class="scout-topbar">
              <button id="scoutBack" class="scout-nav">‹</button>
              <div id="scoutProgress" class="scout-progress">1/4</div>
              <button id="scoutNext" class="scout-nav">›</button>
            </div>

            <img id="scoutImg" class="scout-img" src="scout_1.png" alt="Scout" />
            <div id="scoutTalkArea"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const userName = localStorage.getItem("userName") || "friend";
    const scoutTalk = [
      { img: "scout_1.png", msg: `Hey ${userName}!<br><br>I’m <b>Scout</b> 👋<br>I’m your AI assistant.<br>I’ll help you spot AI scams and keep your DMs safe.`},
      { img: "scout_1.png", msg: `GenAI can help scammers do <b>impersonation</b> — copying usernames, bios, and even typing style.` },
      { img: "scout_2.png", msg: `If a DM feels weird, <b>verify first</b>. Ask for a specific shared memory or call the person.` },
      { img: "scout_3.png", msg: `Watch for <b>urgency</b>: “reply now”, “don’t tell anyone”, “I need help ASAP”.` },
      { img: "scout_4.png", msg: `<b>Safe checklist:</b><br>
          • Verify identity<br>
          • Don’t share location/routine<br>
          • Stop replying, screenshot, block/report` },
      {img: "scout_4.png", msg: `<b>You’re ready.</b> ✅<br><br>You're about to step into a DM conversation.<br><br>Your job is to spot <b>red flags</b> and decide what to do.`},
    ];

    let scoutIndex = 0;

    function renderScout(){
      const img = document.getElementById("scoutImg");
      const area = document.getElementById("scoutTalkArea");
      const back = document.getElementById("scoutBack");
      const next = document.getElementById("scoutNext");
      const progress = document.getElementById("scoutProgress");

      const isLast = scoutIndex === scoutTalk.length - 1;

      progress.textContent = isLast
        ? "Ready?"
        : scoutIndex === 0
          ? "Intro"
          : `${scoutIndex}/${scoutTalk.length - 2}`;

      back.style.display = "inline-flex";
      back.style.visibility = scoutIndex === 0 ? "hidden" : "visible";

    next.style.display = "inline-flex";
    next.textContent = isLast ? "✓" : "›";

      img.src = scoutTalk[scoutIndex].img;

      area.innerHTML = `
        <div class="typing">
          Scout is typing
          <span class="dots"><span></span><span></span><span></span></span>
        </div>
      `;

      setTimeout(() => {
        area.innerHTML = `
          <div class="scout-bubble">
            <span class="scout-name">Scout:</span> ${scoutTalk[scoutIndex].msg}
          </div>
        `;
      }, 650);
    }

    document.getElementById("scoutBack").addEventListener("click", () => {
      if (scoutIndex === 0) return;
      scoutIndex--;
      renderScout();
    });

    document.getElementById("scoutNext").addEventListener("click", () => {
      if (scoutIndex < scoutTalk.length - 1) {
        scoutIndex++;
        renderScout();
      } else {
        window.location.href = "page4.html";
      }
    });

    renderScout();
  </script>
</body>
</html>
